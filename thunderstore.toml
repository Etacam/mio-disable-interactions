[config]
schemaVersion = "0.0.1"

[package]
namespace = "Etacam"
name = "DisableInteractions"
versionNumber = "0.0.1"
description = "Adds options to disable most interactions"
websiteUrl = "https://thunderstore.io"
containsNsfwContent = false

[package.dependencies]
MIOModding-ModdingAPI = "2.0.3"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/DisableInteractions"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "mio-memories-in-orbit", ]
[publish.categories]
mio-memories-in-orbit = []


